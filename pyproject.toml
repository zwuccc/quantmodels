[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qm"
version = "0.1.0"
description = "Honest backtests of six stock trading strategies on free data"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "pyarrow>=14",
  "pyyaml>=6",
  "requests>=2.31",
  "yfinance>=0.2.40",
  "lxml>=5",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["qm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
